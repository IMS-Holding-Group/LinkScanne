<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="page.title.register">إنشاء حساب - LinkScanne</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1>LinkScanne</h1>
                <i class="fa fa-shield-alt"></i>
            </div>
            <nav class="header-nav">
                <ul class="nav-links">
                    <li><a href="index.html"><i class="fa fa-home"></i> <span data-translate="nav.home">الرئيسية</span></a></li>
                    <li><a href="about.html"><i class="fa fa-info-circle"></i> <span data-translate="nav.about">عن المشروع</span></a></li>
                    <li><a href="login.html"><i class="fa fa-key"></i> <span data-translate="nav.login">تسجيل الدخول</span></a></li>
                    <li><a href="register.html" class="btn-register"><i class="fa fa-user-plus"></i> <span data-translate="nav.register">إنشاء حساب</span></a></li>
                </ul>
            </nav>
            <div class="header-left">
                <button id="language-toggle" class="language-btn" onclick="toggleLanguage()">
                    <i class="fa fa-language"></i>
                    <span id="language-text">English</span>
                </button>
                <div class="icon-badge">
                    <i class="fa fa-link"></i>
                    <span>0</span>
                </div>
                <div class="icon-badge">
                    <i class="fa fa-exclamation-triangle"></i>
                    <span>0</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main-content">
            <div class="auth-page">
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <h2><i class="fa fa-user-plus"></i> إنشاء حساب جديد</h2>
                            <p>انضم إلى LinkScanne لحماية أفضل</p>
                        </div>
                        <form class="auth-form" id="register-form">
                            <div class="form-group">
                                <label for="name">الاسم الكامل</label>
                                <input type="text" id="name" name="name" placeholder="أدخل اسمك الكامل" required>
                            </div>
                            <div class="form-group">
                                <label for="email">البريد الإلكتروني</label>
                                <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>
                            </div>
                            <div class="form-group">
                                <label for="password">كلمة المرور</label>
                                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="confirm-password">تأكيد كلمة المرور</label>
                                <input type="password" id="confirm-password" name="confirm-password" placeholder="أعد إدخال كلمة المرور" required>
                            </div>
                            <div class="form-options">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="terms" required>
                                    <span class="checkmark"></span>
                                    أوافق على شروط الاستخدام وسياسة الخصوصية
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary btn-full"><i class="fa fa-user-plus"></i> إنشاء الحساب</button>
                        </form>
                        <div class="auth-footer">
                            <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <p>&copy; 2025 LinkScanne - نظام تحليل الروابط الذكي</p>
        </footer>
    </div>
    <script src="js/config.js"></script>
    <script>
    // تطبيق الاتجاه فوراً حسب اللغة المحفوظة
    (function() {
        var savedLang = localStorage.getItem('linkScanne_language');
        // إذا لم تكن هناك لغة محفوظة، استخدم العربية كافتراضية
        if (!savedLang || (savedLang !== 'ar' && savedLang !== 'en')) {
            savedLang = 'ar';
            localStorage.setItem('linkScanne_language', 'ar');
        }
        // تطبيق الاتجاه حسب اللغة
        var dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.setAttribute('dir', dir);
        document.documentElement.setAttribute('lang', savedLang);
        if (document.body) {
            document.body.setAttribute('dir', dir);
            document.body.setAttribute('lang', savedLang);
        }
        // تطبيق CSS للاتجاه أيضاً
        document.documentElement.style.direction = dir;
        if (document.body) {
            document.body.style.direction = dir;
        }
    })();
    </script>
    <script src="js/translations.js"></script>
    <script>
    function toggleLanguage() {
        var current = currentLang();
        var newLang = current === 'ar' ? 'en' : 'ar';
        
        // تغيير اللغة - هذا سيحفظها في localStorage ويطبقها
        if (typeof setLanguage === 'function') {
            setLanguage(newLang);
        } else {
            // Fallback إذا لم تكن الدالة متاحة
            currentLang = newLang;
            localStorage.setItem('linkScanne_language', newLang);
            if (typeof applyLanguage === 'function') {
                applyLanguage();
            }
        }
        
        // تحديث زر اللغة فوراً
        updateLanguageButton();
        
        // إعادة تطبيق الترجمة بشكل كامل
        setTimeout(function() {
            if (typeof applyLanguage === 'function') {
                applyLanguage();
            }
            updateLanguageButton();
        }, 100);
    }
    
    function updateLanguageButton() {
        var btn = document.getElementById('language-text');
        if (btn) {
            btn.textContent = translate('nav.language');
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        applyLanguage();
        updateLanguageButton();
    });
    </script>
    <script>
    // إذا كان المستخدم مسجل بالفعل (محفوظ محلياً)، لا تبقى في صفحة التسجيل
    (function () {
        try {
            var u = localStorage.getItem('currentUser');
            if (u) {
                window.location.replace('index.html');
            }
        } catch (e) {}
    })();

    document.getElementById('register-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('name').value;
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirm-password').value;
        if (password !== confirmPassword) {
            var d = document.createElement('div');
            d.className = 'error-message';
            d.textContent = 'كلمة المرور غير متطابقة';
            document.getElementById('register-form').insertBefore(d, document.getElementById('register-form').firstChild);
            setTimeout(function(){ d.remove(); }, 5000);
            return;
        }
        if (password.length < 6) {
            var d = document.createElement('div');
            d.className = 'error-message';
            d.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            document.getElementById('register-form').insertBefore(d, document.getElementById('register-form').firstChild);
            setTimeout(function(){ d.remove(); }, 5000);
            return;
        }
        var submitBtn = this.querySelector('button[type="submit"]');
        var txt = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> جاري إنشاء الحساب...';
        var API = (typeof API_BASE !== 'undefined') ? API_BASE : 'http://127.0.0.1:5000';
        fetch(API + '/api/auth/register', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            credentials: 'include',
            body: JSON.stringify({ name: name, email: email, password: password }) 
        })
        .then(function(r) {
            return r.json().catch(function () { return { error: 'رد غير صالح من الخادم' }; });
        })
        .then(function(result) {
            if (result.user) {
                localStorage.setItem('currentUser', JSON.stringify(result.user));
                var n = document.createElement('div');
                n.className = 'notification success';
                n.textContent = 'تم إنشاء الحساب بنجاح';
                document.body.appendChild(n);
                setTimeout(function(){
                    try { n.remove(); } catch (e) {}
                    window.location.replace('index.html');
                }, 800);
                setTimeout(function () { window.location.replace('index.html'); }, 2000);
            } else {
                var d = document.createElement('div');
                d.className = 'error-message';
                d.textContent = result.error || 'فشل في إنشاء الحساب';
                document.getElementById('register-form').insertBefore(d, document.getElementById('register-form').firstChild);
                setTimeout(function(){ d.remove(); }, 5000);
            }
        })
        .catch(function() {
            var d = document.createElement('div');
            d.className = 'error-message';
            d.textContent = 'خطأ في الاتصال بالخادم';
            document.getElementById('register-form').insertBefore(d, document.getElementById('register-form').firstChild);
            setTimeout(function(){ d.remove(); }, 5000);
        })
        .finally(function() {
            submitBtn.disabled = false;
            submitBtn.innerHTML = txt;
        });
    });
    </script>
</body>
</html>
